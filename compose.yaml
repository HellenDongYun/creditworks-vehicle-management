
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: creditworks-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_MEMORY_LIMIT_MB: "2048"

    ports:
      - "127.0.0.1:1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    restart: "no"

volumes:
  sqlserver_data:
